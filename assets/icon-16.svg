<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- 16 px master: the same K of pads, pixel-aligned, no inactive pads or LED. -->
  <rect x="0" y="0" width="16" height="16" rx="3" fill="#18191C"/>
  <g fill="#E9EAEC">
    <rect x="1" y="1" width="4" height="4" rx="1"/>
    <rect x="1" y="6" width="4" height="4" rx="1"/>
    <rect x="1" y="11" width="4" height="4" rx="1"/>
    <rect x="11" y="1" width="4" height="4" rx="1"/>
    <rect x="11" y="11" width="4" height="4" rx="1"/>
  </g>
  <rect x="6" y="6" width="4" height="4" rx="1" fill="#E5392B"/>
</svg>
