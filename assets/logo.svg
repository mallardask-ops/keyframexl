<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 72" width="284" height="72">
  <defs>
    <linearGradient id="logoChassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25272B"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="logoRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E4148"/>
      <stop offset="100%" stop-color="#24262A"/>
    </linearGradient>
    <linearGradient id="logoWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F6F7"/>
      <stop offset="100%" stop-color="#D6D8DC"/>
    </linearGradient>
    <linearGradient id="logoRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F76457"/>
      <stop offset="55%" stop-color="#F0584C"/>
      <stop offset="100%" stop-color="#D63426"/>
    </linearGradient>
  </defs>

  <!-- Step Matrix K icon badge (56x56 centered vertically) -->
  <g transform="translate(8 8) scale(0.4375)">
    <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#logoChassis)" stroke="url(#logoRim)" stroke-width="2.5"/>
    <rect x="14" y="14" width="100" height="100" rx="18" fill="#0D0E10" stroke="#24262B" stroke-width="1.5"/>
    <g fill="#1C1E22" stroke="#282B30" stroke-width="1">
      <rect x="52" y="24" width="24" height="24" rx="6"/>
      <rect x="80" y="52" width="24" height="24" rx="6"/>
      <rect x="52" y="80" width="24" height="24" rx="6"/>
    </g>
    <g fill="url(#logoWhite)">
      <rect x="24" y="24" width="24" height="24" rx="6"/>
      <rect x="24" y="52" width="24" height="24" rx="6"/>
      <rect x="24" y="80" width="24" height="24" rx="6"/>
      <rect x="80" y="24" width="24" height="24" rx="6"/>
      <rect x="80" y="80" width="24" height="24" rx="6"/>
    </g>
    <rect x="52" y="52" width="24" height="24" rx="6" fill="url(#logoRed)"/>
    <rect x="57" y="70" width="14" height="2.8" rx="1.4" fill="#FFFFFF" opacity="0.96"/>
  </g>

  <!-- Wordmark -->
  <text x="78" y="45" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="31" font-weight="600" letter-spacing="-0.5" fill="#E9EAEB">KeyFrame<tspan dx="6" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace" font-size="22" font-weight="600" letter-spacing="1.0" fill="#F0584C">XL</tspan></text>
</svg>
