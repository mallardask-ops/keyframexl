[package]
name = "keyframexl"
version = "0.2.0"
edition = "2024"
description = "Native Linux pattern sequencer prototype"
license = "MIT"

[features]
# Optional Steinberg ASIO backend (enabled by default on Windows).
asio = ["cpal/asio"]

[dependencies]
hound = "3.5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
cpal = "0.18.2"
arc-swap = "1.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
egui_dock = { version = "0.16", path = "vendor/egui_dock", features = ["serde"] }
dirs = "6"
ron = "0.10"
claxon = "0.4"
lewton = "0.10"
rtrb = "0.3"
midly = "0.5"
flacenc = "0.5"
vorbis_rs = "0.5"
mp3lame-sys = "0.2"
midir = "0.11"
base64 = "0.22"
raw-window-handle = "0.6"
rsworld-sys = "0.1.0"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
libloading = "0.8"
vst3-host = { version = "0.11.1", path = "vendor/vst3-host", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["wayland", "x11"] }
# PipeWire as its own host (a node in the graph), ALSA as the fallback.
# Do NOT enable `realtime-dbus`: audio_thread_priority lowers the whole
# process's RLIMIT_RTTIME soft limit to one quantum (e.g. 5333 us), which
# plugin-host / yabridge / Wine children inherit and get killed by SIGXCPU
# during plugin initialization.
cpal = { version = "0.18.2", features = ["pipewire"] }
xcb = { version = "1", features = ["shape", "xtest"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1.2"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# winit with one fix: X11 file drops whose uri-list ends lines with LF only
# (yabridge, dragging a clip out of a Windows plugin) were silently lost.
[patch.crates-io]
winit = { path = "vendor/winit" }

# Debug builds are what an IDE or launcher may run: an unoptimised audio
# engine and DSP crackle and load the CPU many times over, so the program
# itself gets basic optimisation and its dependencies full.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
# Style lints this codebase deliberately does not follow: index loops over
# parallel DSP buffers, wide UI helper signatures, nested callback types.
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
large_enum_variant = "allow"
explicit_counter_loop = "allow"
chunks_exact_to_as_chunks = "allow"
