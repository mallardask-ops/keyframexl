name: Nightly

# Once a day (03:00 UTC) main publishes a nightly prerelease
# (v<Cargo.toml X.Y.Z>-nightly.<UTC yyyymmddHHMM>), but only when code changed
# since the last nightly. Run it by hand from the Actions tab for a build now.
# Stable releases still come from pushing a vX.Y.Z tag (release.yml). The
# in-app updater follows nightlies when Settings → General → Nightly builds
# is on, so every nightly reaches users: see docs/development.md §4.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if nothing but docs changed since the last nightly"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  KFXL_NO_UPDATE_CHECK: "1"
  KEEP_NIGHTLIES: "10"

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.ver.outputs.skip }}
      version: ${{ steps.ver.outputs.version }}
      numeric_version: ${{ steps.ver.outputs.numeric_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version & notes
        id: ver
        run: |
          set -euo pipefail
          # A commit that is itself a stable release gets no nightly.
          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is a stable release; no nightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nothing but docs since the last nightly (or HEAD already has one):
          # skip, unless a manual run asked to force it.
          last=$(git tag --sort=-creatordate --merged HEAD | grep -E -- '-nightly\.' | head -n1 || true)
          if [[ -n "$last" && "${{ inputs.force }}" != "true" ]]; then
            changed=$(git diff --name-only "$last" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**' | wc -l)
            if [[ "$changed" -eq 0 ]]; then
              echo "No code changes since ${last}; no nightly."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # Cargo.toml holds the version being prepared (X.Y.Z-dev between
          # releases); the nightly is X.Y.Z-nightly.<UTC yyyymmddHHMM>.
          base=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          core="${base%%-*}"
          version="${core}-nightly.$(date -u +%Y%m%d%H%M)"
          numeric_version="${core}.0"
          prev=$(git tag --sort=-creatordate --merged HEAD | grep -E '^v[0-9]' | head -n1 || true)
          {
            echo "skip=false"
            echo "version=${version}"
            echo "numeric_version=${numeric_version}"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly ${version} (numeric ${numeric_version}, since ${prev:-start})"

          range="${prev:+${prev}..}HEAD"
          {
            echo "## Nightly ${version}"
            echo
            echo "> **Nightly build** from \`main\` at \`$(git rev-parse --short HEAD)\`. It may have rough edges; the in-app updater installs it when *Nightly builds* is on."
            echo
            echo "### Changes${prev:+ since \`${prev}\`}"
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range" | head -n 60
          } > notes.md
          cat notes.md

      - name: Upload release notes
        if: steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-notes
          path: notes.md

  nightly-linux:
    name: nightly-linux-x86_64
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxcb1-dev \
            libxcb-xtest0-dev \
            libvorbis-dev \
            libogg-dev \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build nightly binary
        env:
          KFXL_BUILD_VERSION: ${{ needs.version.outputs.version }}
          KFXL_VERSION: ${{ needs.version.outputs.version }}
          KFXL_CHANNEL: nightly
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          name=keyframexl-linux-x86_64
          rm -rf dist
          mkdir -p "dist/${name}/docs"
          install -m 755 target/release/keyframexl "dist/${name}/keyframexl"
          cp README.md "dist/${name}/README.md"
          cp LICENSE "dist/${name}/LICENSE"
          cp docs/roadmap.md "dist/${name}/docs/roadmap.md"
          install -m 755 assets/install.sh "dist/${name}/install.sh"
          install -Dm644 assets/keyframexl.desktop "dist/${name}/share/applications/keyframexl.desktop"
          for f in assets/hicolor/*.png; do
            s=$(basename "$f" .png)
            install -Dm644 "$f" "dist/${name}/share/icons/hicolor/${s}x${s}/apps/keyframexl.png"
          done
          install -Dm644 assets/icon.svg "dist/${name}/share/icons/hicolor/scalable/apps/keyframexl.svg"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: keyframexl-linux-x86_64
          path: |
            keyframexl-linux-x86_64.tar.gz
            keyframexl-linux-x86_64.tar.gz.sha256

  nightly-windows:
    name: nightly-windows-x86_64
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Download Steinberg ASIO SDK
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "asio-sdk"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          curl.exe -fsSL -L "https://www.steinberg.net/asiosdk" -o $zip
          tar.exe -xf $zip -C $dir
          $hdr = Get-ChildItem -Path $dir -Recurse -Filter "asiodrivers.h" | Select-Object -First 1
          if (-not $hdr) { throw "asiodrivers.h not found in ASIO SDK archive" }
          $root = $hdr.Directory.Parent.FullName
          "CPAL_ASIO_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test
        run: cargo test --locked

      - name: Build nightly binary
        env:
          KFXL_BUILD_VERSION: ${{ needs.version.outputs.version }}
          KFXL_VERSION: ${{ needs.version.outputs.version }}
          KFXL_CHANNEL: nightly
        run: cargo build --release --locked

      - name: Package portable zip & Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "keyframexl-windows-x86_64"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path "dist\$name\docs" | Out-Null
          Copy-Item "target\release\keyframexl.exe" "dist\$name\keyframexl.exe"
          Copy-Item "README.md" "dist\$name\README.md"
          Copy-Item "LICENSE" "dist\$name\LICENSE"
          Copy-Item "docs\roadmap.md" "dist\$name\docs\roadmap.md"
          Compress-Archive -Path "dist\$name" -DestinationPath "$name.zip" -Force

          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" "/DMyNumericVersion=${{ needs.version.outputs.numeric_version }}" "assets\keyframexl.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Move-Item -Force "dist\$name-setup.exe" "$name-setup.exe"

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($f in @("$name.zip", "$name-setup.exe")) {
            $hash = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path $PWD "$f.sha256"), "$hash  $f`n", $utf8NoBom)
            Get-Content "$f.sha256"
          }

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: keyframexl-windows-x86_64
          path: |
            keyframexl-windows-x86_64.zip
            keyframexl-windows-x86_64.zip.sha256
            keyframexl-windows-x86_64-setup.exe
            keyframexl-windows-x86_64-setup.exe.sha256

  publish:
    name: publish-nightly
    needs: [version, nightly-linux, nightly-windows]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: KeyFrameXL Nightly ${{ needs.version.outputs.version }}
          body_path: release-assets/notes.md
          prerelease: true
          make_latest: false
          files: |
            release-assets/keyframexl-linux-x86_64.tar.gz
            release-assets/keyframexl-linux-x86_64.tar.gz.sha256
            release-assets/keyframexl-windows-x86_64.zip
            release-assets/keyframexl-windows-x86_64.zip.sha256
            release-assets/keyframexl-windows-x86_64-setup.exe
            release-assets/keyframexl-windows-x86_64-setup.exe.sha256

      - name: Prune old nightlies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.createdAt) | reverse | .[].tagName' \
            | tail -n +$((KEEP_NIGHTLIES + 1)) \
            | while read -r tag; do
                echo "Deleting old nightly ${tag}"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              done
