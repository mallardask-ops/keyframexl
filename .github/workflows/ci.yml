name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  KFXL_NO_UPDATE_CHECK: "1"

jobs:
  linux-test:
    name: linux-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-xtest0-dev \
            libvorbis-dev \
            libogg-dev \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (lib)
        run: cargo test --lib

      - name: cargo test (bin)
        run: cargo test --bin keyframexl

  windows-test:
    name: windows-test
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Download Steinberg ASIO SDK
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "asio-sdk"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "asiosdk.zip"
          curl.exe -fsSL -L "https://www.steinberg.net/asiosdk" -o $zip
          tar.exe -xf $zip -C $dir
          $hdr = Get-ChildItem -Path $dir -Recurse -Filter "asiodrivers.h" | Select-Object -First 1
          if (-not $hdr) { throw "asiodrivers.h not found in ASIO SDK archive" }
          $root = $hdr.Directory.Parent.FullName
          Write-Host "CPAL_ASIO_DIR=$root"
          "CPAL_ASIO_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (lib)
        run: cargo test --lib

      - name: cargo test (bin)
        run: cargo test --bin keyframexl
